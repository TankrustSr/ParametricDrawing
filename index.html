<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Laser Spline Designer</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .dup-control { margin-bottom: 12px; }
        .dup-control label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 4px; margin-top: 0; }
        .dup-control input[type="number"], .triple-inputs input[type="number"] { 
            width: 60px; height: 28px; text-align: right; border-radius: 4px; 
            border: 1px solid #555; background: #333; color: white; padding: 0 5px; font-size: 14px;
            touch-action: none; 
            cursor: ns-resize;
            -webkit-user-select: none;
            user-select: none;
        }
        .dup-control input[type="range"] { width: 60px; height: 28px; text-align: right; border-radius: 4px; border: 1px solid #555; background: #333; color: white; padding: 0 5px; font-size: 14px; }
        #menu-duplicate { border-left: 3px solid #0a84ff; background-color: #262626; }
        
        .triple-inputs { display: flex; gap: 5px; margin-bottom: 8px; }
        .triple-inputs input { flex: 1; width: 100% !important; text-align: center !important; }
        .sme-labels { display: flex; font-size: 10px; color: #aaa; padding: 0 2px; }
        .sme-labels span { flex: 1; text-align: center; }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="app-container">
        <aside id="sidebar">
            <section class="menu-section">
                <h2>Presets</h2>
                <select id="preset-select"><option>Default</option></select>
                <div class="button-group">
                    <button id="btn-save-preset">Save</button>
                    <button id="btn-del-preset" class="danger">Delete</button>
                </div>
            </section>

            <section class="menu-section">
                <h2>Layers</h2>
                <select id="layer-select"><option>Layer 1</option></select>
                <div class="button-group">
                    <button id="btn-add-layer">New</button>
                    <button id="btn-dup-layer">Duplicate</button>
                    <button id="btn-del-layer" class="danger">Delete</button>
                </div>
            </section>

            <section class="menu-section">
                <h2>Line Tools</h2>
                <div class="button-group">
                    <button id="btn-tool-draw" class="active">Draw</button>
                    <button id="btn-tool-select">Select/Modify</button>
                </div>
                <div class="button-group" style="margin-top: 10px;">
                    <button id="btn-grid" style="background-color: #444;">Grid: Off</button>
                    <button id="btn-undo">Undo</button>
                </div>
                <div class="button-group" style="margin-top: 10px;">
                    <button id="btn-del-line" class="danger">Del Line</button>
                    <button id="btn-del-point" class="danger">Del Point</button>
                </div>
                
                <label>Color</label>
                <input type="color" id="line-color" value="#000000">

                <label>Line Ends</label>
                <select id="line-cap">
                    <option value="round">Round</option>
                    <option value="square">Square</option>
                </select>
            </section>

            <section class="menu-section" id="menu-duplicate" style="display: none;">
                <h2>Parametric Duplication</h2>
                <div class="dup-control">
                    <label>Copies: <input type="number" id="dup-count-val" min="0" max="50" value="0" step="1"></label>
                    <input type="range" id="dup-count" min="0" max="100" step="1" value="0" style="width: 100%;">
                </div>
                <div class="dup-control">
                    <label>Offset X: <input type="number" id="dup-x-val" value="0" step="1"></label>
                    <input type="range" id="dup-x" min="-800" max="800" step="1" value="0" style="width: 100%;">
                </div>
                <div class="dup-control">
                    <label>Offset Y: <input type="number" id="dup-y-val" value="0" step="1"></label>
                    <input type="range" id="dup-y" min="-800" max="800" step="1" value="0" style="width: 100%;">
                </div>
                <div class="dup-control">
                    <label>Rotation (°): <input type="number" id="dup-rot-val" value="0" step="1"></label>
                    <input type="range" id="dup-rot" min="-360" max="360" step="1" value="0" style="width: 100%;">
                </div>

                <div class="sme-labels"><span>Start</span><span>Mid</span><span>End</span></div>
                <div class="dup-grid-header">
                    <span></span>
                    <span>Mid</span>
                    <span>End</span>
                </div>
                
                <div class="dup-grid-row">
                    <label>Width Multiplier</label>
                    <input type="number" id="dup-w-m" value="1" step="0.1">
                    <input type="number" id="dup-w-e" value="1" step="0.1">
                </div>
                
                <div class="dup-grid-row">
                    <label>Mod Phase Offset</label>
                    <input type="number" id="dup-p-m" value="0" step="0.1">
                    <input type="number" id="dup-p-e" value="0" step="0.1">
                </div>
                
                <div class="dup-grid-row">
                    <label>Mod Amp Multiplier</label>
                    <input type="number" id="dup-a-m" value="1" step="0.1">
                    <input type="number" id="dup-a-e" value="1" step="0.1">
                </div>
                
                <div class="dup-grid-row">
                    <label>Mod Freq Multiplier</label>
                    <input type="number" id="dup-f-m" value="1" step="0.1">
                    <input type="number" id="dup-f-e" value="1" step="0.1">
                </div>
                
                <div class="dup-grid-row">
                    <label>Geometric Scale</label>
                    <input type="number" id="dup-s-m" value="1" step="0.1">
                    <input type="number" id="dup-s-e" value="1" step="0.1">
                </div>
                
                <button id="btn-reset-dup" style="margin-top: 10px; background-color: #555;">Reset Defaults</button>
            </section>

            <section class="menu-section">
                <h2>Width & Modulation</h2>
                <label>Start Width: <span id="val-width-start">3</span>mm</label>
                <input type="range" id="width-start" min="0.1" max="30" step="0.1" value="3">
                
                <label>Middle Width: <span id="val-width-mid">3</span>mm</label>
                <input type="range" id="width-mid" min="0.1" max="30" step="0.1" value="3">
                
                <label>End Width: <span id="val-width-end">3</span>mm</label>
                <input type="range" id="width-end" min="0.1" max="30" step="0.1" value="3">

                <label>Waveform</label>
                <select id="mod-waveform">
                    <option value="none">None</option>
                    <option value="sine">Sine</option>
                    <option value="sawtooth">Sawtooth</option>
                    <option value="square">Square</option>
                </select>

                <label>Base Freq: <span id="val-mod-freq">10</span></label>
                <input type="range" id="mod-freq" min="1" max="50" step="1" value="10">

                <label>Start Mod Amp: <span id="val-mod-amp-start">0</span></label>
                <input type="range" id="mod-amp-start" min="0" max="10" step="0.1" value="0">

                <label>Middle Mod Amp: <span id="val-mod-amp-mid">0</span></label>
                <input type="range" id="mod-amp-mid" min="0" max="10" step="0.1" value="0">

                <label>End Mod Amp: <span id="val-mod-amp-end">0</span></label>
                <input type="range" id="mod-amp-end" min="0" max="10" step="0.1" value="0">

                <label>Exponential Adjust: <span id="val-mod-exp">1</span></label>
                <input type="range" id="mod-exp" min="0.1" max="5" step="0.1" value="1">
            </section>

            <section class="menu-section export-section">
                <button id="btn-preview-3d" class="btn">Preview 3D</button>
                <button id="btn-export-svg" class="primary">Export to .SVG</button>
            </section>
        </aside>

        <main id="canvas-area">
            <canvas id="main-canvas"></canvas>
        </main>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
